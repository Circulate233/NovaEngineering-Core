def minecraftVersion = '1.12.2'
// 与 runtime-test 工作流的 CLEANROOM_VERSION 保持一致（安装器参数也随版本变化）。
def cleanroomVersion = '0.6.13-alpha'

def cleanroomInstaller = configurations.maybeCreate('cleanroomInstaller')
cleanroomInstaller.canBeConsumed = false
cleanroomInstaller.canBeResolved = true
dependencies.add(cleanroomInstaller.name, "com.cleanroommc:cleanroom:${cleanroomVersion}:installer") {
    transitive = false
}

def productionJarTaskName = propertyBool('enable_shadow') ? 'reobfShadowJar' : 'reobfJar'
def productionJarTask = tasks.named(productionJarTaskName)
def runtimeTestProductionMods = configurations.maybeCreate('runtimeTestProductionMods')
runtimeTestProductionMods.canBeConsumed = false
runtimeTestProductionMods.canBeResolved = true
runtimeTestProductionMods.transitive = false
runtimeTestProductionMods.extendsFrom(
    configurations.modImplementation,
    configurations.modRuntimeOnly,
    configurations.modApi
)
def mappingsAttribute = Attribute.of(
    'com.gtnewhorizons.retrofuturagradle.obfuscation',
    String
)
runtimeTestProductionMods.attributes {
    attribute(mappingsAttribute, 'srg')
    attribute(Usage.USAGE_ATTRIBUTE, objects.named(Usage, 'java-runtime'))
}

def modularMachineryDependency = configurations.modImplementation.dependencies.find {
    it.name == 'ModularMachinery-CE'
}
def modularMachineryDevJarName = "${modularMachineryDependency.name}-${modularMachineryDependency.version}-dev.jar"
def remapJarType = productionJarTask.get().class.superclass
def runtimeTestReobfModularMachinery = tasks.register('runtimeTestReobfModularMachinery', remapJarType) {
    input = layout.projectDirectory.file("lib/${modularMachineryDevJarName}")
    libraries.from(sourceSets.main.compileClasspath)
    obfuscation.configureNamedToSrgOperation(remapOperation)
    archiveFileName = "${modularMachineryDependency.name}-${modularMachineryDependency.version}.jar"
    destinationDirectory = layout.buildDirectory.dir('runtime-test/remapped-mods')
}

def runtimeTestModsDir = providers.gradleProperty('runtimeTestModsDir')
    .map { file(it) }
    .orElse(layout.buildDirectory.dir('runtime-test/instance/mods'))
def runtimeTestMinecraftDir = providers.gradleProperty('runtimeTestMinecraftDir')
    .map { file(it) }
    .orElse(layout.buildDirectory.dir('runtime-test/minecraft'))
def runtimeTestSupportDir = layout.buildDirectory.dir('runtime-test/support')
def runtimeTestClientModsDir = layout.buildDirectory.dir('runtime-test/client-mods')
def runtimeMcpRemapMarker = layout.buildDirectory.file(
    'runtime-test/runtime-mcp-remap.marker'
)

def runtimeMcpRemapTask = tasks.register('runtimeTestRemapMcp') {
    dependsOn runtimeTestReobfModularMachinery
    inputs.files(runtimeTestProductionMods)
    inputs.file(runtimeTestReobfModularMachinery.flatMap { it.archiveFile })
    inputs.property('runtimeRemapSchema', 'moddevgradle-mcp-runtime-classpath-v1')
    outputs.file(runtimeMcpRemapMarker)
    doLast {
        def files = runtimeTestProductionMods.files.findAll {
            it.name.endsWith('.jar') && !it.name.endsWith('-sources.jar') && it.name != modularMachineryDevJarName
        }
        files += runtimeTestReobfModularMachinery.get().archiveFile.get().asFile
        runtimeMcpRemapMarker.get().asFile.with {
            parentFile.mkdirs()
            text = files.collect { it.name }.sort().join('\n') + '\n'
        }
        logger.lifecycle(
            "[RuntimeTest] ModDevGradle supplied ${files.size()} runtime mod variant(s)"
        )
    }
}

tasks.register('stageRuntimeTestMods', Sync) {
    dependsOn productionJarTask
    dependsOn runtimeMcpRemapTask
    from(productionJarTask.flatMap { it.archiveFile })
    from(runtimeTestProductionMods) {
        include '*.jar'
        exclude '*-sources.jar'
        exclude modularMachineryDevJarName
    }
    from(runtimeTestReobfModularMachinery.flatMap { it.archiveFile })
    into(runtimeTestModsDir)
    include '*.jar'
    duplicatesStrategy = DuplicatesStrategy.FAIL
}

tasks.register('stageRuntimeTestClientMods', Sync) {
    dependsOn 'stageRuntimeTestMods'
    from(runtimeTestSupportDir) {
        include '*.jar'
    }
    into(runtimeTestClientModsDir)
    include '*.jar'
    duplicatesStrategy = DuplicatesStrategy.FAIL
}

tasks.register('installRuntimeTestClient', JavaExec) {
    dependsOn cleanroomInstaller
    dependsOn 'stageRuntimeTestClientMods'
    classpath = cleanroomInstaller
    mainClass = 'net.minecraftforge.installer.SimpleInstaller'
    def installDir = runtimeTestMinecraftDir.get().asFile
    def profile = new File(
        installDir,
        "versions/${minecraftVersion}-Cleanroom-${cleanroomVersion}/" +
        "${minecraftVersion}-Cleanroom-${cleanroomVersion}.json"
    )
    def cleanroomJar = new File(
        installDir,
        "libraries/com/cleanroommc/cleanroom/${cleanroomVersion}/" +
        "cleanroom-${cleanroomVersion}.jar"
    )
    def marker = layout.buildDirectory.file('runtime-test/cleanroom-client-installed.marker').get().asFile
    onlyIf {
        !marker.exists()
            || marker.text.trim() != "${minecraftVersion}-Cleanroom-${cleanroomVersion}"
            || !profile.isFile()
            || !cleanroomJar.isFile()
    }
    doFirst {
        installDir.mkdirs()
        def launcherProfiles = new File(installDir, 'launcher_profiles.json')
        if (!launcherProfiles.exists()) {
            launcherProfiles.text = '{"profiles":{},"selectedProfile":""}'
        }
        args '--install-client', installDir.absolutePath
    }
    doLast {
        marker.parentFile.mkdirs()
        marker.text = "${minecraftVersion}-Cleanroom-${cleanroomVersion}\n"
    }
}

def runtimeTestConfigDir = layout.projectDirectory.dir('.github/runtime-test-config')
def runtimeTestServerConfigDir = layout.buildDirectory.dir('runtime-test/server/config')
def runtimeTestInstanceTemplate = layout.buildDirectory.file(
    'runtime-test/cleanroom-instance-template.zip'
)
def runtimeTestTemplateRequiredEntries = [
    'instance.cfg',
    'mmc-pack.json',
    'patches/net.minecraft.json',
    'patches/net.minecraftforge.json',
    'patches/org.lwjgl3.json'
]

def runtimeTestConfigFiles = providers.provider {
    def dir = runtimeTestConfigDir.asFile
    if (!dir.isDirectory()) {
        return []
    }
    def files = dir.listFiles({ candidate ->
        candidate.isFile() && candidate.name.endsWith('.cfg')
    } as FileFilter)
    if (files == null) {
        return []
    }
    return files.toList().sort { left, right -> left.name <=> right.name }
}

def downloadRuntimeTestTemplate = { String downloadUrl, File target ->
    def partial = new File(target.parentFile, "${target.name}.part")
    def lastError = null
    for (int attempt = 1; attempt <= 3; attempt++) {
        try {
            java.net.HttpURLConnection connection =
                java.net.URI.create(downloadUrl).toURL().openConnection()
            connection.setConnectTimeout(30000)
            connection.setReadTimeout(120000)
            connection.setInstanceFollowRedirects(true)
            connection.setRequestProperty('User-Agent', 'novaeng-runtime-test')
            def status = connection.getResponseCode()
            if (status != 200) {
                throw new GradleException("HTTP ${status}")
            }
            partial.withOutputStream { output ->
                connection.getInputStream().withCloseable { input ->
                    input.transferTo(output)
                }
            }
            connection.disconnect()
            return partial
        } catch (Exception error) {
            lastError = error
            partial.delete()
            logger.lifecycle(
                "[RuntimeTest] 模板下载第 ${attempt} 次失败：${error.message}"
            )
            if (attempt < 3) {
                Thread.sleep(2000L * attempt)
            }
        }
    }
    throw new GradleException(
        "无法下载 Cleanroom 模板 ${downloadUrl}：${lastError}"
    )
}

def stageRuntimeTestServerConfig = tasks.register('stageRuntimeTestServerConfig', Sync) {
    group = 'unimined'
    description = '把 .github/runtime-test-config 下的 cfg 放到运行时测试服务端的 config 目录。'
    from(runtimeTestConfigDir) {
        include '*.cfg'
    }
    into(runtimeTestServerConfigDir)
    duplicatesStrategy = DuplicatesStrategy.FAIL
}

def injectRuntimeTestClientConfig = tasks.register('injectRuntimeTestClientConfig') {
    group = 'unimined'
    description = '把运行时测试配置注入 Cleanroom MMC 模板 zip，解压后即成为客户端的 config。'
    inputs.files(runtimeTestConfigFiles)
    inputs.property('cleanroomVersion', cleanroomVersion)
    inputs.property('requiredEntries', runtimeTestTemplateRequiredEntries)
    outputs.upToDateWhen { false }
    doLast {
        def configFiles = runtimeTestConfigFiles.get()
        if (configFiles.isEmpty()) {
            logger.lifecycle(
                '[RuntimeTest] .github/runtime-test-config 下没有 cfg，跳过客户端配置注入。'
            )
            return
        }

        def templateFile = runtimeTestInstanceTemplate.get().asFile
        if (!templateFile.isFile()) {
            templateFile.parentFile.mkdirs()
            def templateUrl = 'https://github.com/CleanroomMC/Cleanroom/releases/download/' +
                "${cleanroomVersion}/cleanroom-${cleanroomVersion}.zip"
            logger.lifecycle("[RuntimeTest] 本地缺少模板，开始下载：${templateUrl}")
            def downloaded = downloadRuntimeTestTemplate(templateUrl, templateFile)
            java.nio.file.Files.move(
                downloaded.toPath(),
                templateFile.toPath(),
                java.nio.file.StandardCopyOption.REPLACE_EXISTING
            )
        }

        def additions = new LinkedHashMap<String, File>()
        configFiles.each { configFile ->
            additions.put("minecraft/config/${configFile.name}".toString(), configFile)
        }

        def rewritten = new File(templateFile.parentFile, "${templateFile.name}.injected")
        rewritten.delete()
        def written = new LinkedHashSet<String>()
        new java.util.zip.ZipFile(templateFile).withCloseable { sourceZip ->
            def rawOutput = new FileOutputStream(rewritten)
            try {
                new java.util.zip.ZipOutputStream(
                    new BufferedOutputStream(rawOutput)
                ).withCloseable { targetZip ->
                    sourceZip.entries().each { entry ->
                        if (additions.containsKey(entry.name)) {
                            // 模板自带同名配置：丢弃，稍后写入我们的版本。
                            return
                        }
                        def copied = new java.util.zip.ZipEntry(entry.name)
                        copied.time = entry.time
                        if (entry.comment != null) {
                            copied.comment = entry.comment
                        }
                        if (entry.extra != null) {
                            copied.extra = entry.extra
                        }
                        targetZip.putNextEntry(copied)
                        if (!entry.isDirectory()) {
                            sourceZip.getInputStream(entry).withCloseable { input ->
                                input.transferTo(targetZip)
                            }
                        }
                        targetZip.closeEntry()
                        written.add(entry.name)
                    }
                    additions.each { entryName, configFile ->
                        def added = new java.util.zip.ZipEntry(entryName)
                        added.time = configFile.lastModified()
                        targetZip.putNextEntry(added)
                        configFile.withInputStream { input ->
                            input.transferTo(targetZip)
                        }
                        targetZip.closeEntry()
                        written.add(entryName)
                    }
                }
            } finally {
                rawOutput.close()
            }
        }

        runtimeTestTemplateRequiredEntries.each { requiredEntry ->
            if (!written.contains(requiredEntry)) {
                rewritten.delete()
                throw new GradleException(
                    "Cleanroom 模板缺少 ${requiredEntry}，已放弃写入注入后的模板。"
                )
            }
        }
        additions.keySet().each { injectedEntry ->
            if (!written.contains(injectedEntry)) {
                rewritten.delete()
                throw new GradleException("配置注入失败：${injectedEntry} 未写入模板。")
            }
        }
        if (rewritten.length() <= 0L) {
            rewritten.delete()
            throw new GradleException('注入后的模板为空，已放弃覆盖原模板。')
        }

        java.nio.file.Files.move(
            rewritten.toPath(),
            templateFile.toPath(),
            java.nio.file.StandardCopyOption.REPLACE_EXISTING
        )
        logger.lifecycle(
            "[RuntimeTest] 已向客户端模板注入 ${additions.size()} 个配置：" +
                additions.keySet().join(', ')
        )
    }
}

tasks.named('stageRuntimeTestMods') {
    dependsOn stageRuntimeTestServerConfig
}
tasks.named('installRuntimeTestClient') {
    dependsOn injectRuntimeTestClientConfig
}

tasks.register('printRuntimeTestPaths') {
    doLast {
        println "runtimeTestModsDir=${runtimeTestModsDir.get().asFile.absolutePath}"
        println "runtimeTestMinecraftDir=${runtimeTestMinecraftDir.get().asFile.absolutePath}"
    }
}

spotless {
    java {
        target 'src/main/java/**/*.java', 'src/api/java/**/*.java'
        leadingTabsToSpaces()
        endWithNewline()
        removeUnusedImports()
    }
}

def curseforgeProjectId = findProperty('curseforge_project_id')
if (curseforgeProjectId != null && !curseforgeProjectId.toString().isBlank()) {
    curseforgeProjectId = curseforgeProjectId.toString().trim()
    if (!curseforgeProjectId.matches('\\d+')) {
        throw new GradleException(
            "Property curseforge_project_id must be a numeric CurseForge project id: ${curseforgeProjectId}"
        )
    }
    def curseforgeReleaseType = findProperty('curseforge_release_type')
    if (curseforgeReleaseType == null || curseforgeReleaseType.toString().isBlank()) {
        def detectedVersion = propertyString('mod_version').toLowerCase()
        if (detectedVersion.contains('alpha')) {
            curseforgeReleaseType = 'alpha'
        } else if (detectedVersion.contains('beta') || detectedVersion.contains('pre') || detectedVersion.contains('rc')) {
            curseforgeReleaseType = 'beta'
        } else {
            curseforgeReleaseType = 'release'
        }
    } else {
        curseforgeReleaseType = curseforgeReleaseType.toString().toLowerCase().trim()
    }
    if (!['alpha', 'beta', 'release'].contains(curseforgeReleaseType)) {
        throw new GradleException(
            "Property curseforge_release_type must be one of alpha, beta, release: ${curseforgeReleaseType}"
        )
    }
    setDefaultProperty('curseforge_game_versions', false, '1.12.2,Forge,Java 25,Client,Server')
    def curseforgeGameVersions = []
    propertyStringList('curseforge_game_versions', ',').each { curseforgeGameVersions.add(it.trim()) }
    curseforgeGameVersions.removeAll { it.isBlank() }
    if (curseforgeGameVersions.isEmpty()) {
        throw new GradleException('Property curseforge_game_versions must define at least one CurseForge game version tag!')
    }
    def curseforgeRelationTypes = [
        'curseforge_relations_required': 'requiredDependency',
        'curseforge_relations_optional': 'optionalDependency',
        'curseforge_relations_embedded': 'embeddedLibrary',
        'curseforge_relations_incompatible': 'incompatible',
        'curseforge_relations_tool': 'tool'
    ]
    def curseforgeRelations = [:]
    curseforgeRelationTypes.each { propertyKey, relationType ->
        setDefaultProperty(propertyKey, false, '')
        def slugs = []
        propertyStringList(propertyKey).each { slugs.add(it) }
        if (!slugs.isEmpty()) {
            curseforgeRelations.put(relationType, slugs)
        }
    }
    def curseforgeChangelogFile = null
    def curseforgeChangelogProperty = findProperty('curseforge_changelog_file')
    if (curseforgeChangelogProperty != null && !curseforgeChangelogProperty.toString().isBlank()) {
        curseforgeChangelogFile = file(curseforgeChangelogProperty.toString())
    } else if (file('CHANGELOG.md').isFile()) {
        curseforgeChangelogFile = file('CHANGELOG.md')
    }
    setDefaultProperty('curseforge_debug_mode', false, 'false')
    def curseforgeDebugMode = propertyBool('curseforge_debug_mode')

    tasks.register('publishCurseForge', net.darkhax.curseforgegradle.TaskPublishCurseForge) {
        dependsOn tasks.named('build')
        group = 'publishing'
        description = "Publishes the production mod jar to CurseForge project ${curseforgeProjectId}."
        apiToken = providers.environmentVariable('CURSEFORGE_TOKEN')
        debugMode = curseforgeDebugMode
        def mainFile = upload(curseforgeProjectId, productionJarTask.get())
        mainFile.releaseType = curseforgeReleaseType
        mainFile.changelogType = 'markdown'
        if (curseforgeChangelogFile != null) {
            mainFile.changelog = curseforgeChangelogFile
        }
        curseforgeGameVersions.each { mainFile.addGameVersion(it) }
        curseforgeRelations.each { relationType, slugs ->
            mainFile.addRelations(relationType, slugs as String[])
        }
    }

    def curseforgeAddon = file('addon.gradle')
    if (curseforgeAddon.isFile()) {
        apply from: curseforgeAddon
        logger.lifecycle("Applied CurseForge addon script: ${curseforgeAddon}")
    }
}
